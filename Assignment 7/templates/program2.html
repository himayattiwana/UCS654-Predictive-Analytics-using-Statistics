<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Program 2 Mashup Service</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      line-height: 1.4;
    }
    h1 { margin-bottom: 16px; }
    form {
      border: 1px solid #ccc;
      padding: 16px;
      border-radius: 8px;
      background: #fafafa;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      margin-top: 16px;
      padding: 10px 16px;
      background: #f2a100;
      border: 1px solid #cc8800;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    .note { margin-top: 16px; color: #444; }
    .error {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      background: #ffe6e6;
      color: #7a0000;
      border: 1px solid #ffb3b3;
    }
    .success {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      background: #e9fbe9;
      color: #0a5a0a;
      border: 1px solid #b9ecb9;
    }
  </style>
</head>
<body>
  <h1>Program 2 [Required]: Mashup Web Service</h1>

  <form method="post" action="/">
    <label for="singer_name">Singer Name</label>
    <input id="singer_name" name="singer_name" type="text" value="{{ singer_name or '' }}" required>

    <label for="number_of_videos"># of videos (must be > 10)</label>
    <input id="number_of_videos" name="number_of_videos" type="number" min="11" value="{{ number_of_videos or '' }}" required>

    <label for="duration_seconds">Duration of each video in seconds (must be > 20)</label>
    <input id="duration_seconds" name="duration_seconds" type="number" min="21" value="{{ duration_seconds or '' }}" required>

    <label for="email">Email Id</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required>

    <button type="submit">Submit</button>
  </form>

  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}

  {% if success %}
    <div class="success">{{ success }}</div>
  {% endif %}

  <p class="note">
    This service creates the mashup, zips the result, and emails the zip file to the provided email id.
  </p>
</body>
</html>
